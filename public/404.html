<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#26355f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>ページが見つかりません — Ptah</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafaf8; color: #20262c; font: 16px/1.85 -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif; }
    main { width: min(100% - 44px, 680px); margin: 0 auto; padding: 88px 0; }
    img { width: 64px; height: 64px; }
    h1 { margin: 18px 0 8px; font-size: 28px; }
    p { margin: 0 0 12px; }
    a { color: #124b95; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid #124b95; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/ptah-simple.svg" alt="" width="64" height="64">
    <h1>ページが見つかりません</h1>
    <p>URLが変更されたか、ページが存在しません。</p>
    <p><a href="/">Ptah公式ホームページへ戻る</a></p>
  </main>
</body>
</html>
